type: bulk
args:

- type: run_sql
  args:
    sql: |
      CREATE TABLE IF NOT EXISTS fork_si_items (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL
      );
      INSERT INTO fork_si_items (id, name) VALUES (1, 'Item 1') ON CONFLICT DO NOTHING;

- type: track_table
  args:
    schema: public
    name: fork_si_items

- type: create_select_permission
  args:
    table: fork_si_items
    role: user
    permission:
      columns: '*'
      filter: {}
